<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ChartSignal"/>
<meta name="theme-color" content="#090b0f"/>
<title>ChartSignal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:#090b0f;color:#c8d0e0;font-family:'Courier New',monospace;min-height:100vh;padding:40px 16px 48px;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,160,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,160,.03) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}
.w{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto}
h1{text-align:center;font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:-.02em;margin-bottom:4px}
h1 span{color:#00f5a0}
.sub{text-align:center;font-size:.65rem;color:#4a5570;letter-spacing:.15em;text-transform:uppercase;margin-bottom:24px}
.box{border:1.5px dashed #1c2030;border-radius:14px;background:#0e1117;padding:30px 16px;text-align:center;position:relative;touch-action:manipulation;margin-bottom:14px}
.box.has{padding:0;border-style:solid;overflow:hidden}
.box input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}
.ico{font-size:2.2rem;margin-bottom:8px;opacity:.5}
.lbl{font-size:.95rem;font-weight:700;color:#c8d0e0}
.hint{margin-top:10px;display:inline-block;background:rgba(0,245,160,.08);border:1px solid rgba(0,245,160,.2);color:#00f5a0;font-size:.7rem;padding:5px 14px;border-radius:20px}
#pi{width:100%;display:block;border-radius:12px}
.clr{position:absolute;top:10px;right:10px;background:rgba(9,11,15,.9);border:1px solid #1c2030;color:#4a5570;padding:6px 14px;font-size:.7rem;cursor:pointer;border-radius:20px;z-index:10;font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.field label{display:block;font-size:.6rem;color:#4a5570;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.field input,.field select{width:100%;background:#0e1117;border:1px solid #1c2030;color:#c8d0e0;padding:12px;font-family:inherit;font-size:16px;border-radius:8px;outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:rgba(0,245,160,.4)}
.field select option{background:#0e1117}
.btn{width:100%;padding:16px;background:transparent;border:1.5px solid #00f5a0;color:#00f5a0;font-weight:900;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:10px;font-family:inherit;transition:all .18s}
.btn:active:not(:disabled){background:#00f5a0;color:#090b0f}
.btn:disabled{opacity:.3;border-color:#4a5570;color:#4a5570}
.bar{height:3px;background:#1c2030;margin-top:10px;border-radius:2px;display:none;overflow:hidden}
.bar.on{display:block}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#00f5a0,#00c8ff);animation:ld 2s ease-in-out infinite}
@keyframes ld{0%{width:0%;margin-left:0}50%{width:65%}100%{width:0%;margin-left:100%}}
.err{margin-top:10px;padding:12px 14px;background:rgba(255,62,108,.06);border:1px solid rgba(255,62,108,.3);border-radius:8px;font-size:.75rem;color:#ff3e6c;display:none;line-height:1.5}
.err.on{display:block}
.card{margin-top:16px;border:1px solid #1c2030;border-radius:14px;background:#0e1117;overflow:hidden;display:none;animation:fu .3s ease}
.card.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.top{padding:20px 16px;border-bottom:1px solid #1c2030;display:flex;align-items:center;justify-content:space-between}
.top.BUY{background:rgba(0,245,160,.06)}
.top.SELL{background:rgba(255,62,108,.06)}
.top.NEUTRAL{background:rgba(240,192,64,.06)}
.sig-l{font-size:.58rem;color:#4a5570;letter-spacing:.15em;text-transform:uppercase;margin-bottom:2px}
.sig-v{font-size:2.6rem;font-weight:900;line-height:1}
.sig-v.BUY{color:#00f5a0}.sig-v.SELL{color:#ff3e6c}.sig-v.NEUTRAL{color:#f0c040}
.pill{font-size:.65rem;padding:5px 12px;border-radius:20px;font-weight:700;text-align:center}
.pill-l{font-size:.5rem;opacity:.7;display:block;margin-bottom:1px;letter-spacing:.1em;text-transform:uppercase}
.pill.BUY{background:rgba(0,245,160,.12);color:#00f5a0}
.pill.SELL{background:rgba(255,62,108,.12);color:#ff3e6c}
.pill.NEUTRAL{background:rgba(240,192,64,.12);color:#f0c040}
.body{padding:14px;display:grid;gap:14px}
.st{font-size:.57rem;color:#4a5570;letter-spacing:.13em;text-transform:uppercase;margin-bottom:5px;font-weight:700}
.txt{font-size:.8rem;line-height:1.7;color:#c8d0e0}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.lb{background:#090b0f;border:1px solid #1c2030;border-radius:8px;padding:9px 7px;text-align:center}
.lb .n{font-size:.52rem;color:#4a5570;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.lb .v{font-size:.78rem;font-weight:700;color:#fff;word-break:break-word}
.lb.e .v{color:#00f5a0}.lb.s .v{color:#ff3e6c}.lb.t .v{color:#7eb8ff}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.65rem;padding:3px 10px;border:1px solid #1c2030;border-radius:20px;color:#4a5570;background:#090b0f}
.disc{margin-top:18px;font-size:.57rem;color:#4a5570;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="w">
  <h1>Chart<span>Signal</span></h1>
  <div class="sub">AI Trade Direction · XAUUSD</div>

  <div class="box" id="uz">
    <input type="file" id="fi" accept="image/*"/>
    <div id="ph">
      <div class="ico">📈</div>
      <div class="lbl">Tap to upload chart</div>
      <div class="hint">📷 Camera or Gallery</div>
    </div>
    <img id="pi" style="display:none" alt="chart"/>
    <button class="clr" id="clr" style="display:none">✕</button>
  </div>

  <div class="row">
    <div class="field">
      <label>Pair</label>
      <input type="text" id="pair" placeholder="XAUUSD" value="XAUUSD" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"/>
    </div>
    <div class="field">
      <label>Timeframe</label>
      <select id="tf">
        <option>M1</option><option>M5</option><option selected>M15</option><option>M30</option>
        <option>H1</option><option>H4</option><option>D1</option>
      </select>
    </div>
  </div>

  <button class="btn" id="ab" disabled>⚡ GET SIGNAL</button>
  <div class="bar" id="bar"><i></i></div>
  <div class="err" id="err"></div>

  <div class="card" id="card">
    <div class="top" id="top">
      <div>
        <div class="sig-l">Signal</div>
        <div class="sig-v" id="sv">—</div>
      </div>
      <div class="pill" id="pill">
        <span class="pill-l">Confidence</span>
        <span id="ct">—</span>
      </div>
    </div>
    <div class="body">
      <div><div class="st">Analysis</div><div class="txt" id="ra"></div></div>
      <div>
        <div class="st">Levels</div>
        <div class="lg">
          <div class="lb e"><div class="n">Entry</div><div class="v" id="le">—</div></div>
          <div class="lb s"><div class="n">Stop Loss</div><div class="v" id="ls">—</div></div>
          <div class="lb t"><div class="n">Take Profit</div><div class="v" id="lt">—</div></div>
        </div>
      </div>
      <div><div class="st">Patterns</div><div class="tags" id="tg"></div></div>
      <div><div class="st">Risk</div><div class="txt" id="rr"></div></div>
    </div>
  </div>
  <div class="disc">⚠ AI only · Not financial advice · Use your own risk management</div>
</div>
<script>
const g=id=>document.getElementById(id);
let b64=null,mime='image/jpeg';
g('fi').addEventListener('change',()=>load(g('fi').files[0]));
function load(f){
  if(!f||!f.type.startsWith('image/'))return;
  mime=f.type;
  const r=new FileReader();
  r.onload=e=>{
    b64=e.target.result.split(',')[1];
    g('pi').src=e.target.result;g('pi').style.display='block';
    g('ph').style.display='none';g('clr').style.display='block';
    g('uz').classList.add('has');g('ab').disabled=false;
    g('card').classList.remove('on');g('err').classList.remove('on');
  };
  r.readAsDataURL(f);
}
g('clr').addEventListener('click',e=>{
  e.stopPropagation();b64=null;g('fi').value='';
  g('pi').style.display='none';g('pi').src='';
  g('ph').style.display='block';g('clr').style.display='none';
  g('uz').classList.remove('has');g('ab').disabled=true;
  g('card').classList.remove('on');g('err').classList.remove('on');
});
g('ab').addEventListener('click',async()=>{
  if(!b64)return;
  const pair=g('pair').value.trim()||'XAUUSD';
  const tf=g('tf').value;
  g('ab').disabled=true;g('bar').classList.add('on');
  g('card').classList.remove('on');g('err').classList.remove('on');
  const prompt=`You are a professional trading analyst. Analyze this ${pair} ${tf} chart.
Respond ONLY with raw JSON, no markdown, no backticks, starting with { ending with }:
{"signal":"BUY or SELL or NEUTRAL","confidence":"HIGH or MEDIUM or LOW","analysis":"2-3 sentences on trend and momentum","entry_zone":"price","stop_loss":"price","take_profit":"price","patterns":["p1","p2"],"risk_note":"one line"}`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mime,data:b64}},
          {type:'text',text:prompt}
        ]}]})
    });
    const raw=await res.text();
    const data=JSON.parse(raw);
    if(!res.ok)throw new Error(data?.error?.message||'HTTP '+res.status);
    let txt=(data.content?.find(b=>b.type==='text')?.text||'').trim();
    txt=txt.replace(/```[\s\S]*?```/g,'').replace(/`/g,'').trim();
    const s=txt.indexOf('{'),e=txt.lastIndexOf('}');
    if(s<0||e<0)throw new Error('Bad response');
    render(JSON.parse(txt.slice(s,e+1)));
  }catch(e){
    const er=g('err');er.textContent='⚠ '+e.message;er.classList.add('on');
  }finally{
    g('ab').disabled=false;g('bar').classList.remove('on');
  }
});
function render(d){
  const sig=(d.signal||'NEUTRAL').toUpperCase();
  g('top').className='top '+sig;g('sv').textContent=sig;g('sv').className='sig-v '+sig;
  g('pill').className='pill '+sig;g('ct').textContent=d.confidence||'—';
  g('ra').textContent=d.analysis||'—';g('le').textContent=d.entry_zone||'—';
  g('ls').textContent=d.stop_loss||'—';g('lt').textContent=d.take_profit||'—';
  g('rr').textContent=d.risk_note||'—';
  const t=g('tg');t.innerHTML='';
  (d.patterns||[]).forEach(p=>{const s=document.createElement('span');s.className='tag';s.textContent=p;t.appendChild(s);});
  g('card').classList.add('on');
  setTimeout(()=>g('card').scrollIntoView({behavior:'smooth',block:'start'}),100);
}
</script>
</body>
</html>
